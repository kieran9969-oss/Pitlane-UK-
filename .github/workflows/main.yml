name: Update Events

'on':
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * *'

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
- name: Test Santa Pod connection
  run: python importers/santapod.py
      - name: Update event data
        run: python sync.py

      - name: Commit
