name: Update Events

'on':
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * *'
permissions:
  contents: write
jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository

        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:

          python-version: '3.12'

      
      
      - name: Test Goodwood checker
        run: python goodwood.py
  
      - name: Check modified car show sources
        run: python modified_shows.py

      - name: Import Modified Live events
        run: python modified_live.py

      - name: Import Tunerfest events
        run: python tunerfest.py

      - name: Import Tunerfest events
        run: python tunerfest.py

      - name: Import combined car events
        run: python combined_events.py

      - name: Test combined event importer
        run: python test_combined_events.py

      - name: Check all event announcements
        run: python event_checker.py

      - name: Remove past events
        run: python cleanup_events.py
        
      - name: Remove past events
        run: python cleanup_events.py
     
      - name: Update event data
        run: python sync.py

      - name: Commit updated events



        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/manual-events.json
          if ! git diff --cached --quiet; then
            git commit -m "Update PITLANE UK events"
            git push

          fi
